# Bonus (private registry): the same image, with the dockerconfigjson Secret from the
# operator namespace. Only difference to 05 is registrySecretRef.
apiVersion: security.stefanpetrov.dev/v1alpha1
kind: ImageScan
metadata:
  name: private-with-secret
spec:
  podSelector:
    matchLabels:
      app: private
  registrySecretRef:
    name: dockerhub-creds
