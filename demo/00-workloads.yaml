# Demo workloads, matching the example scenario in the task: Pods labelled app=web
# in a namespace labelled env=production. The staging Pod has the same app=web
# label, so the namespace selector is what has to leave it out.
apiVersion: v1
kind: Namespace
metadata:
  name: production
  labels:
    env: production
---
apiVersion: v1
kind: Namespace
metadata:
  name: staging
  labels:
    env: staging
---
apiVersion: v1
kind: Pod
metadata:
  name: web
  namespace: production
  labels:
    app: web
spec:
  containers:
    - name: nginx
      image: nginx:1.25
---
apiVersion: v1
kind: Pod
metadata:
  name: cache
  namespace: production
  labels:
    app: web
spec:
  containers:
    - name: redis
      image: redis:7
---
apiVersion: v1
kind: Pod
metadata:
  name: web
  namespace: staging
  labels:
    app: web
spec:
  containers:
    - name: alpine
      image: alpine:3.20
      command: ["sh", "-c", "while true; do sleep 3600; done"] # keeps running, no restarts
