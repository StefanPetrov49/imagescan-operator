# Helper Pod to look inside the results volume:
#   kubectl apply -f hack/pvc-reader.yaml
#   kubectl exec -n imagescan-operator-system pvc-reader -- ls -la /data
#   kubectl delete -f hack/pvc-reader.yaml
apiVersion: v1
kind: Pod
metadata:
  name: pvc-reader
  namespace: imagescan-operator-system
spec:
  automountServiceAccountToken: false
  securityContext:          # passes the "restricted" Pod Security Standard
    runAsNonRoot: true
    runAsUser: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: reader
      image: busybox:1.36
      command: ["sleep", "600"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      volumeMounts:
        - name: results
          mountPath: /data
          readOnly: true
  volumes:
    - name: results
      persistentVolumeClaim:
        claimName: imagescan-operator-results