apiVersion: v1
kind: Pod
metadata:
  name: pvc-reader
  namespace: imagescan-operator-system
spec:
  containers:
    - name: reader
      image: busybox
      command: ["sleep", "600"]
      volumeMounts:
        - name: results
          mountPath: /data
  volumes:
    - name: results
      persistentVolumeClaim:
        claimName: imagescan-operator-results
