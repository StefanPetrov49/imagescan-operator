apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: results            # kustomize turns this into "imagescan-operator-results"
  namespace: system        # kustomize replaces this with imagescan-operator-system
  labels:
    app.kubernetes.io/name: imagescan-operator
    app.kubernetes.io/managed-by: kustomize
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi