apiVersion: security.stefanpetrov.dev/v1alpha1
kind: ImageScan
metadata:
  labels:
    app.kubernetes.io/name: imagescan-operator
    app.kubernetes.io/managed-by: kustomize
  name: imagescan-sample
spec:
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: default
  podSelector:
    matchLabels:
      app: web
  minSeverity: MEDIUM